name: research-lead
version: "1.0"
description: Research lead. Frames the question, assigns the digging and the synthesis, and owns the final answer.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
