name: review-lead
version: "1.0"
description: Review lead. Splits a review across independent reviewers and merges their findings into one report.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
