name: product-lead
version: "1.0"
description: Product lead. Owns the what and the why, from problem to a scoped, testable plan.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
