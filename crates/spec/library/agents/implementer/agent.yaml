name: implementer
version: "1.0"
description: Builder. Makes one bounded change at a time and proves it works before handing it on.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
