name: prototyper
version: "1.0"
description: Prototyper. Builds quick, throwaway-quality prototypes that answer product questions.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
