name: synthesizer
version: "1.0"
description: Synthesizer. Turns findings into a clear, honest, decision-ready summary.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
