name: advisor
version: "1.0"
description: Product advisor. Turns the operator's ideas into clear problems and acceptance criteria for the lead.

defaults:
  runtime: claude-code
  lifecycle:
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      guidance: [role]

resources:
  guidance:
    - id: role
      path: guidance/role.md
