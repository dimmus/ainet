# Its own workspace, outside the console's (which excludes it): building
# `ainet` never fetches Zed. `.cargo/config.toml` shares one target dir.
[workspace]
resolver = "3"

[package]
name = "ainet-gui"
description = "The ainet desktop app: a Zed-style control room for teams of coding agents, on GPUI and Zed's UI components"
version = "0.1.0"
edition = "2024"
# GPUI and Zed's ui/theme crates follow Zed's toolchain.
rust-version = "1.98"
# Links Zed's GPL-3.0-or-later `ui` and `theme` crates; the rest of the
# workspace stays MIT. See docs/GUI-PLAN.md.
license = "GPL-3.0-or-later"
repository = "https://github.com/dimmus/ainet"

[[bin]]
name = "ainet-gui"
path = "src/main.rs"

[dependencies]
ainet-core = { path = "../core" }
ainet-critter = { path = "../critter" }
ainet-model = { path = "../model" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
# This machine's name, for the Topology view's host (already in the tree,
# through x11rb).
gethostname = "1"
# Bundled themes, icons, fonts and keymaps, embedded in debug builds too so
# the binary is always self-contained.
rust-embed = { version = "8.11", features = ["debug-embed", "include-exclude"] }
# assets/settings-schema.json from the settings' types (the version Zed's
# crates already build).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zed's lenient JSON: comments and trailing commas in settings and keymaps.
serde_json_lenient = "0.2"
# The indent guides' row depths (Zed's `ui` takes a `SmallVec`).
smallvec = "1"
# Grapheme and word boundaries for the text input.
unicode-segmentation = "1.13"
# Cell widths, to cut scrollback lines at a terminal's edge.
unicode-width = "0.2"
# Agents' terminal screens, as `ainet-model` keeps them.
vt100 = "0.16"
# Zed, pinned to one release; upgrade all of them together (docs/GUI.md).
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2", features = ["font-kit", "wayland", "x11"] }
# Zed's fuzzy matcher, as its pickers use (gpui, path and log only).
fuzzy = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
# `menu::Confirm`, `menu::Cancel`, … : the actions Zed's lists and menus share.
menu = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
# The theme JSON schema (`ThemeStyleContent`); Zed's `settings` and
# `theme_settings` would pull in fs, git and wasmtime.
settings_content = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
theme = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
ui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
# Zed's `InputField`, backed by our `TextInput` (its `ErasedEditor`).
ui_input = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }

[dev-dependencies]
# Headless app and window contexts for tests (`#[gpui::test]`).
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2", features = ["test-support"] }
# The screenshot test (`src/screenshot.rs`, ignored by default): GPUI's
# offscreen wgpu renderer and the text system the Linux build uses.
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2", features = ["test-support"] }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
# To check that every `ui::IconName` has a bundled icon.
strum = "0.28"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The GUI's Zed dependencies need the same patched crates Zed builds with
# (copied from Zed's root Cargo.toml at the pinned tag; see docs/GUI.md).
# Cargo reads patches and profiles only from a workspace root, so they live
# here, not in the console's manifest.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

# As the console's profiles (the root Cargo.toml).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
